# go_to 기술 학습 설정 (ML-Agents 1.1.0, PPO)
# 실행 (conda 환경 mlagents, 저장소 루트에서):
#   mlagents-learn rl/configs/goto.yaml --run-id goto_v1 --results-dir rl/results
#   → Unity 에디터에서 Play
behaviors:
  GoTo:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 5
